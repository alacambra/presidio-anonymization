name: Build macOS App

on:
  push:
    tags:
      - 'mac-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.1.0)'
        required: false
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/mac-* ]]; then
            VERSION="${GITHUB_REF#refs/tags/mac-}"
          else
            VERSION="${{ github.event.inputs.version || '0.1.0' }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build executable with PyInstaller
        run: pyinstaller build_macos.spec --clean

      - name: Create DMG
        run: |
          mkdir -p dmg_content
          cp -r "dist/DocumentAnonymizer.app" dmg_content/
          ln -s /Applications dmg_content/Applications
          hdiutil create -volname "DocumentAnonymizer" -srcfolder dmg_content -ov -format UDZO "dist/DocumentAnonymizer-${{ steps.version.outputs.version }}.dmg"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocumentAnonymizer-${{ steps.version.outputs.version }}-macos
          path: dist/DocumentAnonymizer.app
          retention-days: 30

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocumentAnonymizer-${{ steps.version.outputs.version }}-dmg
          path: dist/DocumentAnonymizer-${{ steps.version.outputs.version }}.dmg
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/mac-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DocumentAnonymizer-${{ steps.version.outputs.version }}.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
